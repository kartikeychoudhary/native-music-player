[workspace]
resolver = "3"
members = ["crates/protocol", "crates/engine-core", "crates/aurora-engine", "crates/fixtures-gen", "crates/library"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
engine-core = { path = "crates/engine-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
crossbeam-channel = "0.5.17"
symphonia = { version = "0.6.1", features = ["all"] }
opus = "0.4.0"
fdk-aac = "0.8.0"
rubato = "5.0.1"
audioadapter-buffers = "5.1"
rtrb = "0.4.0"
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive"] }
library = { path = "crates/library" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.4"
jwalk = "0.9.0"
rayon = "1.10"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3.1"
blake3 = "1.8.7"
tempfile = "3.27.0"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
