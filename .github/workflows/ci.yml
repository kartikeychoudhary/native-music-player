name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libpipewire-0.3-dev libspa-0.2-dev ffmpeg xvfb
          # Ubuntu 24.04 runners block unprivileged user namespaces, which Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        # Homebrew's ffmpeg formula no longer builds libvorbis (needed by fixtures/generate.sh); ffmpeg-full
        # does. It is keg-only, so put its bin directory on PATH for the later steps.
        run: |
          brew install cmake ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        # cmake is already on the Windows runner image; only ffmpeg is missing.
        run: choco install -y --no-progress ffmpeg
      - name: Check ffmpeg encoders
        run: |
          ffmpeg -hide_banner -encoders > ffmpeg-encoders.txt
          for enc in libmp3lame libvorbis libopus aac alac flac; do
            grep -qE "^ [A-Z.]{6} $enc " ffmpeg-encoders.txt || { echo "ffmpeg is missing encoder: $enc"; exit 1; }
          done
          rm ffmpeg-encoders.txt
      - uses: actions/cache@v4
        with:
          path: fixtures/out
          key: fixtures-${{ runner.os }}-${{ hashFiles('fixtures/generate.sh', 'engine/crates/fixtures-gen/src/**', 'engine/crates/engine-core/src/decode/dsd/modulator.rs') }}
      - name: Fixtures
        run: '[ -f fixtures/out/dsd64.dff ] || bash fixtures/generate.sh'
      - name: Remove generated protocol types so the tests regenerate every one
        run: find shared/protocol -name '*.ts' -delete
      - name: Engine tests
        run: cargo test --manifest-path engine/Cargo.toml --workspace
      - name: Library benchmark (20k tracks, Linux)
        if: runner.os == 'Linux'
        env: { AURORA_BENCH_TRACKS: '20000' }
        run: cargo test --release --manifest-path engine/Cargo.toml -p library --test bench_100k -- --ignored --nocapture
      - name: Engine tests without fdk-aac
        run: cargo test --manifest-path engine/Cargo.toml -p engine-core --no-default-features --test open
      # Clippy runs on every OS: coreaudio_hog.rs, alsa_hw.rs and the PipeWire probe are cfg-gated per platform.
      - name: Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      # Catches modified, deleted (stale/orphaned after regeneration) and untracked (never git-added) files.
      - name: Generated protocol types are committed
        run: |
          status=$(git status --porcelain --untracked-files=all -- shared/protocol)
          if [ -n "$status" ]; then
            echo "shared/protocol is out of date; regenerate with the engine tests and commit:"
            echo "$status"
            git diff -- shared/protocol
            exit 1
          fi
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --prefix app
      - name: Versions agree
        run: node app/build-tools/check-version.ts
      - run: npm --prefix app run typecheck
      - run: npm --prefix app test
      - name: Build engine for e2e
        run: cargo build --manifest-path engine/Cargo.toml -p aurora-engine
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix app run e2e
      - name: E2E (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm --prefix app run e2e
      - name: Third-party licenses
        run: node app/build-tools/licenses.ts
