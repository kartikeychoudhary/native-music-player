# Aurora packaging (spec §9 M4). Engine binaries are staged into resources/engine/<platform>-<arch>/
# by build-tools/stage-engine.ts; afterPack fails the build if an arch's engine is missing.
appId: io.github.kartikeychoudhary.aurora # installKind.ts looks for "Uninstall ${productName}.exe"
productName: Aurora
copyright: Copyright © 2026 Kartikey Choudhary
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
afterPack: build-tools/afterPack.cjs
extraResources:
  - from: resources/engine/${platform}-${arch}
    to: bin/${platform}-${arch}
  - from: build/generated/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  - from: build/generated/build-info.json
    to: build-info.json
  - from: ../LICENSE
    to: LICENSE.txt
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: kartikeychoudhary
  repo: native-music-player
  releaseType: draft
# "Open with Aurora" / double-click (the app reads files from argv, second-instance and open-file).
# The extension list is AUDIO_EXTENSIONS from src/shared/api.ts without mp4, which is usually video
# (m4a and m4b cover audio); a test keeps them in step. `name` becomes a registry class key under
# HKCU/Software/Classes on Windows, which the uninstaller deletes whole, so it must be Aurora's own.
# Linux MIME types are under linux.mimeTypes: an association's mimeType would write malformed MIME XML.
fileAssociations:
  - ext: [mp3, m4a, m4b, aac, flac, wav, aif, aiff, aifc, ogg, oga, opus, dsf, dff]
    name: Aurora.Audio
    description: Audio file
    role: Viewer
win:
  target:
    - { target: nsis, arch: [x64, arm64] }
    - { target: zip, arch: [x64, arm64] }
  # Signing is done by SignPath in CI in two passes (docs/SIGNING.md); build-tools/sign.cjs collects or
  # applies signed copies and does nothing unless AURORA_SIGN_MODE is set. The publisher name is not set
  # here: it goes into app-update.yml, and electron-updater then rejects any update not signed by that
  # publisher, which would strand an unsigned build's users. package-ci.ts adds it in the release-signed
  # (apply, --release-signed) pass only, never in test-signed builds.
  signtoolOptions:
    sign: build-tools/sign.cjs
    signingHashAlgorithms: [sha256]
  signExts: [.exe, .dll]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-win-setup.${ext}
  license: build/license.txt
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  shortcutName: Aurora
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
mac:
  category: public.app-category.music
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  target:
    - { target: dmg, arch: [x64, arm64] }
    - { target: zip, arch: [x64, arm64] }
linux:
  category: Audio
  # Only feeds the .desktop MimeType= line (see fileAssociations).
  mimeTypes: [audio/mpeg, audio/mp4, audio/x-m4a, audio/aac, audio/flac, audio/wav, audio/x-wav, audio/aiff, audio/x-aiff, audio/ogg, audio/opus, audio/x-dsf, audio/x-dff]
  # The .desktop Exec line otherwise ends in %U, which hands over file:// URIs (still understood, but
  # %F gives file managers local paths).
  executableArgs: ['%F']
  synopsis: Hi-res music player
  description: Aurora plays local music libraries with gapless and bit-perfect output.
  target:
    - { target: AppImage, arch: [x64, arm64] }
    - { target: deb, arch: [x64, arm64] }
    - { target: rpm, arch: [x64, arm64] }
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
    - libpipewire-0.3-0t64 | libpipewire-0.3-0
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - alsa-lib
    - (pipewire-libs or libpipewire-0_3-0)
