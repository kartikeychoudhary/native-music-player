<!doctype html>
<!-- Source of the NSIS wizard art (app/build/installerSidebar.bmp, installerHeader.bmp). Rendered at exact size
     by build-tools/render-installer-art.cjs (?view=sidebar | header); run node app/build-tools/make-installer-art.ts. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .mark { display: block; }

  /* Sidebar: 164 x 314, the welcome and finish pages (and the uninstaller's). */
  body.sidebar { width: 164px; height: 314px; color: #fff;
    background:
      radial-gradient(120px 110px at 50% 78px, rgba(255, 181, 71, 0.22), transparent 70%),
      linear-gradient(180deg, #1c191f 0%, #17151a 55%, #100e12 100%); }
  .sidebar .mark { position: absolute; left: 50px; top: 46px; width: 64px; height: 64px; filter: drop-shadow(0 6px 14px rgba(255, 181, 71, 0.28)); }
  .sidebar .name { position: absolute; top: 128px; width: 100%; text-align: center; font-weight: 700; font-size: 28px; letter-spacing: -0.6px; color: #fff; }
  .sidebar .tag { position: absolute; top: 166px; width: 100%; text-align: center; font-size: 10.5px; line-height: 15px; letter-spacing: 0.3px; color: #a8a29a; }
  .sidebar .bars { position: absolute; left: 0; right: 0; bottom: 22px; height: 76px; display: flex; justify-content: center; align-items: flex-end; gap: 3px; }
  .sidebar .bars i { display: block; width: 5px; border-radius: 2px 2px 1px 1px; background: linear-gradient(180deg, #ffc76e 0%, #ffb547 70%, rgba(255, 181, 71, 0.55) 100%); }
  .sidebar .base { position: absolute; left: 14px; right: 14px; bottom: 18px; height: 1px; background: rgba(255, 181, 71, 0.35); }

  /* Header: 150 x 57, the right end of the inner pages' white header strip. */
  body.header { width: 150px; height: 57px; background: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 12px; }
  .header .mark { width: 30px; height: 30px; }
  .header .name { font-weight: 700; font-size: 19px; letter-spacing: -0.4px; color: #17151a; }
</style>
</head>
<body>
<script>
  const view = new URLSearchParams(location.search).get('view') === 'header' ? 'header' : 'sidebar'
  document.body.className = view
  // The app mark, the same geometry as src/shared/iconPixels.ts: rounded amber square, dark play triangle.
  const mark = '<svg class="mark" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#ffb547"/><polygon points="36,26 36,74 74,50" fill="#17151a"/></svg>'
  if (view === 'sidebar') {
    const heights = [10, 18, 28, 40, 34, 52, 64, 48, 72, 58, 44, 56, 38, 30, 22, 26, 16, 10]
    document.body.innerHTML = mark +
      '<div class="name">Aurora</div>' +
      '<div class="tag">Hi-res music player<br>gapless &middot; bit-perfect</div>' +
      '<div class="bars">' + heights.map((h) => `<i style="height:${h}px"></i>`).join('') + '</div>' +
      '<div class="base"></div>'
  } else {
    document.body.innerHTML = mark + '<div class="name">Aurora</div>'
  }
</script>
</body>
</html>
