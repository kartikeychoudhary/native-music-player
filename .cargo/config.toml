[env]
TS_RS_EXPORT_DIR = { value = "shared/protocol", relative = true }
TS_RS_LARGE_INT = "number"
# Static CRT for cmake-built C code too (see msvc-static-crt.cmake); the cmake crate reads these per target.
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
# fdk-aac's FDK_archdef.h doesn't recognise MSVC's _M_ARM64 and falls through to a `#warning`, which MSVC
# only accepts from C++23 on (C1188 otherwise). In C++23 mode it stays a warning and the generic C paths build.
# fdk-aac-sys's build script doesn't call cc's .cpp(true), so cc passes CFLAGS (not CXXFLAGS) to its .cpp files.
CFLAGS_aarch64_pc_windows_msvc = "/std:c++latest"

# The packaged engine must start on Windows machines without the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
